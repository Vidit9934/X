name: Supabase keepalive

on:
  schedule:
    # Every 6 days — comfortably inside Supabase free tier's 7-day idle-pause window.
    - cron: "0 12 */6 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch Supabase via the backend's health/db endpoint
        run: curl -sf "${{ secrets.RENDER_BASE_URL }}/health/db"
